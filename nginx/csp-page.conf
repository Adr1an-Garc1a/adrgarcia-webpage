# Strict CSP for HTML documents: no inline script/style, no third parties,
# Trusted Types enforced so DOM XSS sinks (innerHTML, etc.) are blocked.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
