# nginx (unprivileged image) for Cloud Run. TLS is terminated by Google's
# front end; the container only speaks HTTP on $PORT (8080).

# Only directives the base image's nginx.conf does not already set live at
# http level (it defines keepalive_timeout, sendfile, etc.; a duplicate makes
# `nginx -t` fail). Timeouts/limits go inside the server block below.
server_tokens off;

# Keep the *.run.app URL out of search results; only the custom domain is indexed.
map $host $robots_tag {
    ~\.run\.app$  "noindex, nofollow";
    default       "all";
}

map $sent_http_content_type $cache_control {
    default                        "public, max-age=86400";
    ~*text/html                    "no-cache";
    ~*text/css                     "public, max-age=31536000, immutable";
    ~*javascript                   "public, max-age=31536000, immutable";
    ~*font/                        "public, max-age=31536000, immutable";
    ~*image/                       "public, max-age=2592000";
    ~*application/pdf              "public, max-age=86400";
    ~*xml                          "public, max-age=3600";
}

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/xml text/plain;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    client_max_body_size 1k;      # static site: no request bodies accepted
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    index index.html;

    absolute_redirect off;       # relative redirects (Cloud Run hostname differs from $host port)
    port_in_redirect off;

    # Canonical host: www -> apex.
    if ($host = www.adrgarcia.com) {
        return 301 https://adrgarcia.com$request_uri;
    }

    # Static site: only GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Cache-Control $cache_control always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-page.conf;

    location = / {
        add_header Cache-Control $cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        try_files /index.html =404;
    }

    location ^~ /en/ {
        add_header Cache-Control $cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        error_page 404 /en/404.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location / {
        add_header Cache-Control $cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # PDFs: a strict page CSP (or sandbox) breaks the browser's built-in PDF
    # viewer, so our own first-party documents only forbid framing.
    location ^~ /docs/ {
        add_header Cache-Control $cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        types { application/pdf pdf; }
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        add_header Cache-Control $cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never serve dotfiles or backup/source artefacts.
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(map|bak|swp|orig|md|mjs|sh|env|conf|ya?ml|json\.bak)$ { return 404; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
    }
    location = /en/404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp-page.conf;
    }
}
